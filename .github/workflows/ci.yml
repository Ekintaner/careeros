name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_INTERNAL_URL: "http://localhost:5080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_CONTAINER_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore apps/api/CareerOS.sln --locked-mode
      - run: dotnet format apps/api/CareerOS.sln --verify-no-changes --no-restore
      - run: dotnet build apps/api/CareerOS.sln --configuration Release --no-restore
      - run: dotnet test apps/api/CareerOS.sln --configuration Release --no-build --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/api/**/TestResults/*.trx
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - name: Start clean infrastructure
        env:
          POSTGRES_PASSWORD: ci-disposable-only-password
        run: docker compose up -d --wait
      - name: Verify database and Redis
        env:
          POSTGRES_PASSWORD: ci-disposable-only-password
        run: |
          docker compose exec -T postgres psql -U careeros -d careeros -c 'SELECT 1'
          docker compose exec -T redis redis-cli ping
      - name: Stop disposable infrastructure
        if: always()
        env:
          POSTGRES_PASSWORD: ci-disposable-only-password
        run: docker compose down
